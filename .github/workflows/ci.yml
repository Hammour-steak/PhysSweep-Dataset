name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-rigid.txt
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Repository contract tests
        run: |
          python -m unittest -v \
            tests.test_repository_hygiene \
            tests.test_pipeline_boundaries \
            tests.test_physics_sweep \
            tests.test_physics_rule_invariants
